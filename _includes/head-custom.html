<!-- Read by the theme of the GitHub Pages site (jekyll-theme-primer) at the end of <head>.
     GitHub draws the mermaid blocks of a README itself; Jekyll leaves them as code blocks.
     This draws them on the Pages site. If the script cannot be loaded, the blocks stay as
     readable code and the browser console says why. -->
<style>
  pre.mermaid { background: none; padding: 0; text-align: center; overflow-x: auto; }
  /* On a phone the diagram keeps a readable size and scrolls sideways. */
  pre.mermaid svg { min-width: 640px; }
</style>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";

  for (const code of document.querySelectorAll("pre > code.language-mermaid")) {
    const diagram = document.createElement("pre");
    diagram.className = "mermaid";
    diagram.textContent = code.textContent;
    code.parentElement.replaceWith(diagram);
  }
  mermaid.initialize({ startOnLoad: false });
  await mermaid.run();
</script>
